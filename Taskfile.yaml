version: '3'

vars:
  # イメージのタグに使うコミット。作業ツリーに未コミットの変更があっても、そのコミットの名前になる点に注意
  GIT_SHA:
    sh: git rev-parse --short HEAD
  ECR_REPO: '{{ .AWS_ACCOUNT_ID }}.dkr.ecr.{{ .AWS_REGION }}.amazonaws.com/ephemera'
  ECSPRESSO: ecspresso --config deploy/ecs/ecspresso.yml

tasks:
  run:
    cmds:
      - reflex -r '\.go$' -s go run $(ls *.go) $*

  build:
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap $(ls *.go)

  build-image:
    deps:
      - build
    cmds:
      # バイナリは build で amd64 向けにクロスコンパイル済み。イメージも amd64 に固定する
      - docker build --platform linux/amd64 --provenance=false -t ephemera -f docker/Dockerfile .

  # ECR の認証は docker の credHelpers（amazon-ecr-credential-helper の ecr-login）に任せる。
  # ~/.docker/config.json の credHelpers に "<アカウント>.dkr.ecr.<リージョン>.amazonaws.com": "ecr-login" が要る
  push-image:
    deps:
      - build-image
    cmds:
      - docker tag ephemera {{ .ECR_REPO }}:{{ .GIT_SHA }}
      - docker tag ephemera {{ .ECR_REPO }}:current
      - docker push {{ .ECR_REPO }}:{{ .GIT_SHA }}
      - docker push {{ .ECR_REPO }}:current

  deploy:
    deps:
      - build
    cmds:
      - lambroll deploy --envfile .env

  # ECS（クラスター brightest / サービス ephemera）へ ecspresso でデプロイする。
  # イメージの push はしない。先に push の権限がある環境で task push-image を実行しておくこと。
  # いまのコミットのハッシュのタグのイメージが ECR にあることを確かめてからデプロイする（読み取り権限で足りる）。
  # 必要な環境変数: AWS_ACCOUNT_ID, AWS_REGION, EPHEMERA_SSM_PREFIX（deploy/ecs/ecspresso.yml を参照）
  deploy-ecs:
    preconditions:
      - sh: aws ecr describe-images --region {{ .AWS_REGION }} --repository-name ephemera --image-ids imageTag={{ .GIT_SHA }} >/dev/null 2>&1
        msg: "ECR に ephemera:{{ .GIT_SHA }} がありません。先に task push-image を実行してください"
    cmds:
      - IMAGE_TAG={{ .GIT_SHA }} {{ .ECSPRESSO }} deploy

  # デプロイ前に、リポジトリの定義と ECS 上の今の定義の違いを見る
  diff-ecs:
    cmds:
      - IMAGE_TAG={{ .GIT_SHA }} {{ .ECSPRESSO }} diff

  # ロール・イメージ・SSM パラメータなど、定義が参照するものが使えるかを確かめる
  verify-ecs:
    cmds:
      - IMAGE_TAG={{ .GIT_SHA }} {{ .ECSPRESSO }} verify


  clean:
    cmds:
      - rm -f bootstrap

  logs:
    cmds:
      - lambroll logs --follow
